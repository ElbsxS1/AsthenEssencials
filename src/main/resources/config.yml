# Asthen Essentials

menu-item:
  material: NETHER_STAR      # NÃO use COMPASS: o WorldEdit usa a bússola para teleportar ao bloco olhado

worlds:
  allowed: [survival]        # mundos onde menu, homes e /tpa funcionam (o lobby fica de fora)

homes:
  max: 5

teleport:
  warmup-seconds: 5          # espera antes de teleportar; mexer cancela (0 = instantâneo)
  cooldown-seconds: 10       # intervalo entre teleportes
  tpa-timeout-seconds: 60

moderation:
  default-reason: "Sem motivo"
