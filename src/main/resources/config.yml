# Asthen Essentials

compass:
  give-on-join: true         # entrega a bússola do menu ao entrar e ao renascer

homes:
  max: 5

teleport:
  warmup-seconds: 5          # espera antes de teleportar; mexer cancela (0 = instantâneo)
  cooldown-seconds: 10       # intervalo entre teleportes
  tpa-timeout-seconds: 60

moderation:
  default-reason: "Sem motivo"
