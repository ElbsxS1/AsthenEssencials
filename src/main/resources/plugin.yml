name: AsthenEssentials
version: '${project.version}'
main: br.asthen.essentials.bukkit.AsthenEssentials
api-version: '26.3'
description: Economia, homes, warps, spawn, TPA, back, rtp e moderação para o servidor Asthen.
authors: [ElbsxS1]

commands:
  money:
    description: Mostra seu saldo ou o de outro jogador.
    aliases: [saldo, bal, balance]
    usage: /money [jogador]
    permission: asthenessentials.money
  pay:
    description: Envia dinheiro a outro jogador.
    usage: /pay <jogador> <valor>
    permission: asthenessentials.pay
  baltop:
    description: Ranking dos mais ricos.
    aliases: [topmoney]
    usage: /baltop
    permission: asthenessentials.money
  eco:
    description: Administra o dinheiro dos jogadores.
    usage: /eco <give|take|set> <jogador> <valor>
    permission: asthenessentials.admin
  sethome:
    description: Define uma home.
    usage: /sethome [nome]
    permission: asthenessentials.home
  home:
    description: Vai para uma home.
    usage: /home [nome]
    permission: asthenessentials.home
  delhome:
    description: Apaga uma home.
    usage: /delhome <nome>
    permission: asthenessentials.home
  homes:
    description: Lista suas homes.
    usage: /homes
    permission: asthenessentials.home
  setwarp:
    description: Cria ou move um warp.
    usage: /setwarp <nome>
    permission: asthenessentials.admin
  delwarp:
    description: Apaga um warp.
    usage: /delwarp <nome>
    permission: asthenessentials.admin
  warp:
    description: Vai para um warp.
    usage: /warp <nome>
    permission: asthenessentials.warp
  warps:
    description: Lista os warps.
    usage: /warps
    permission: asthenessentials.warp
  setspawn:
    description: Define o spawn.
    usage: /setspawn
    permission: asthenessentials.admin
  spawn:
    description: Vai para o spawn.
    usage: /spawn
    permission: asthenessentials.spawn
  tpa:
    description: Pede para ir até outro jogador.
    usage: /tpa <jogador>
    permission: asthenessentials.tpa
  tpaccept:
    description: Aceita um pedido de teleporte.
    usage: /tpaccept
    permission: asthenessentials.tpa
  tpdeny:
    description: Recusa um pedido de teleporte.
    usage: /tpdeny
    permission: asthenessentials.tpa
  back:
    description: Volta ao último local (ou à morte).
    usage: /back
    permission: asthenessentials.back
  rtp:
    description: Teleporte aleatório.
    usage: /rtp
    permission: asthenessentials.rtp
  kick:
    description: Expulsa um jogador.
    usage: /kick <jogador> [motivo]
    permission: asthenessentials.admin
  ban:
    description: Bane um jogador.
    usage: /ban <jogador> [motivo]
    permission: asthenessentials.admin
  tempban:
    description: Bane por tempo (30m, 2h, 7d).
    usage: /tempban <jogador> <tempo> [motivo]
    permission: asthenessentials.admin
  unban:
    description: Remove um ban.
    usage: /unban <jogador>
    permission: asthenessentials.admin
  mute:
    description: Silencia um jogador (tempo opcional).
    usage: /mute <jogador> [tempo] [motivo]
    permission: asthenessentials.admin
  unmute:
    description: Remove o silêncio.
    usage: /unmute <jogador>
    permission: asthenessentials.admin
  aessentials:
    description: Recarrega a configuração.
    usage: /aessentials reload
    permission: asthenessentials.admin

permissions:
  asthenessentials.admin:
    description: Comandos de administração e moderação.
    default: op
  asthenessentials.money:
    default: true
  asthenessentials.pay:
    default: true
  asthenessentials.home:
    default: true
  asthenessentials.warp:
    default: true
  asthenessentials.spawn:
    default: true
  asthenessentials.tpa:
    default: true
  asthenessentials.back:
    default: true
  asthenessentials.rtp:
    default: true
